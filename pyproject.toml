[project]
description = "Source code for animated teaching materials."
readme = "README.md"
name = "plot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "kokoro-manim-voiceover>=0.1.5",
    "manim>=0.19.2",
    "manim-themes>=0.1.3",
    "manim-voiceover[azure,gtts]>=0.4.0",
    "requests>=2.34.2",
]


[dependency-groups]
dev = ["prek>=0.4.11", "ruff>=0.16.0"]


[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["F405", "F403"]
