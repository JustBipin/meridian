[project]
description = "Source code for animated teaching materials."
readme = "README.md"
name = "plot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["manim>=0.19.2", "manim-themes>=0.1.3", "requests>=2.34.2"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["F405", "F403"]
